name: CodeQL

# Static analysis for JavaScript and TypeScript (routes, indexer, and related
# code). Dependency advisories are covered by audit.yml; the container image by
# container.yml. See docs/code-scanning.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npx prisma generate
      - run: npm run build

      - uses: github/codeql-action/analyze@v3