name: Validate PR Title

# Checks the pull request title against the Conventional Commit format in
# CONTRIBUTING.md. The allowed types live in scripts/validate-pr-title.mjs.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  validate-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-title.mjs
