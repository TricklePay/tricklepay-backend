name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository. A job that needs more must request it
# in its own permissions block rather than widening this default.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci runs the postinstall hook, which generates the Prisma client
      # that the type checker and build depend on.
      - run: npm ci

      - run: npm run typecheck

      # The JUnit report is written outside the checkout so it never shows up
      # as an untracked file, and is uploaded below whether or not tests pass.
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/test-results/unit.xml"

      - run: npm run build

  # Measures unit test coverage and publishes it; nothing here fails on a low
  # number. The per-file table goes to the job summary and the full report
  # (HTML and JSON) is uploaded as an artifact. See docs/test-coverage.md.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - name: Write coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  migration-check:
    name: migration-check (Postgres ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest

    # Each version runs to completion, so a failure on one does not hide
    # whether the other passes.
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the tested versions in docs/DATABASE.md.
        postgres-version: [16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tricklepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_test
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validate the migration chain against a clean database.  deploy
      # applies every pending migration in order; if any step fails the
      # chain is broken and the workflow stops with a clear error.
      - name: Validate Prisma migrations
        run: npx prisma migrate deploy

      # Confirm the generated client matches the schema after migration.
      - name: Verify generated client is in sync
        run: npx prisma generate

      # Run the integration suite against the same database. The schema-drift
      # test also needs an empty shadow database (SHADOW_DATABASE_URL above),
      # created here on the service container.
      #
      # The server is the postgres:16 service image; createdb is the client
      # preinstalled on ubuntu-latest (PostgreSQL 18 at the time of writing),
      # which connects to it over TCP. createdb takes the new database's name
      # as its only argument and has no -d option (#695): the connection
      # flags below are all it needs, and it connects through the default
      # "postgres" maintenance database.
      - name: Integration tests
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci -d tricklepay_test tricklepay_shadow
          npx vitest run --project integration --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/test-results/integration.xml"

      # The database's own log is often the only explanation for a flaky
      # integration failure, and it is gone once the service container stops.
      - name: Collect Postgres logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/test-results"
          docker logs "${{ job.services.postgres.id }}" > "$RUNNER_TEMP/test-results/postgres.log" 2>&1 || true

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-postgres-${{ matrix.postgres-version }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
