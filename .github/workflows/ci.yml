name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci runs the postinstall hook, which generates the Prisma client
      # that the type checker and build depend on.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # Measures unit test coverage and publishes it; nothing here fails on a low
  # number. The per-file table goes to the job summary and the full report
  # (HTML and JSON) is uploaded as an artifact. See docs/test-coverage.md.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - name: Write coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  migration-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tricklepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_test
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validate the migration chain against a clean database.  deploy
      # applies every pending migration in order; if any step fails the
      # chain is broken and the workflow stops with a clear error.
      - name: Validate Prisma migrations
        run: npx prisma migrate deploy

      # Confirm the generated client matches the schema after migration.
      - name: Verify generated client is in sync
        run: npx prisma generate

      # Run the integration suite against the same database.
      - name: Integration tests
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci -d tricklepay_test tricklepay_shadow
          npx vitest run --project integration
