name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci runs the postinstall hook, which generates the Prisma client
      # that the type checker and build depend on.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # Unused and undeclared dependencies do not depend on the Node version, so
  # this runs once rather than in each entry of the build matrix. Known false
  # positives are listed with their reasons in .depcheckrc.yml.
  depcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # depcheck resolves CLI-only dependencies (tsc, tsx, prisma) through
      # their installed bin entries, so it needs node_modules in place.
      - run: npm ci

      - run: npm run depcheck

  migration-check:
    name: migration-check (Postgres ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest

    # Each version runs to completion, so a failure on one does not hide
    # whether the other passes.
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the tested versions in docs/DATABASE.md.
        postgres-version: [16, 17]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tricklepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_test
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validate the migration chain against a clean database.  deploy
      # applies every pending migration in order; if any step fails the
      # chain is broken and the workflow stops with a clear error.
      - name: Validate Prisma migrations
        run: npx prisma migrate deploy

      # Confirm the generated client matches the schema after migration.
      - name: Verify generated client is in sync
        run: npx prisma generate

      # Run the integration suite against the same database.
      - name: Integration tests
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci -d tricklepay_test tricklepay_shadow
          npx vitest run --project integration
