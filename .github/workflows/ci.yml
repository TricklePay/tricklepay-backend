name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci runs the postinstall hook, which generates the Prisma client
      # that the type checker and build depend on.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  sbom:
    runs-on: ubuntu-latest
    env:
      # Pinned so the SBOM format does not drift with the runner's bundled npm.
      # Keep in step with release.yml (docs/container-image.md#sboms).
      NPM_SBOM_VERSION: 10.9.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads package-lock.json only, so no install is needed. Dev
      # dependencies are included because the runtime image ships them.
      - name: Generate npm SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          npx --yes "npm@$NPM_SBOM_VERSION" sbom --sbom-format cyclonedx --sbom-type application \
            --package-lock-only > sbom/tricklepay-backend-npm.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-npm
          path: sbom/
          if-no-files-found: error

  migration-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tricklepay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_test
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/tricklepay_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Validate the migration chain against a clean database.  deploy
      # applies every pending migration in order; if any step fails the
      # chain is broken and the workflow stops with a clear error.
      - name: Validate Prisma migrations
        run: npx prisma migrate deploy

      # Confirm the generated client matches the schema after migration.
      - name: Verify generated client is in sync
        run: npx prisma generate

      # Run the integration suite against the same database.
      - name: Integration tests
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci -d tricklepay_test tricklepay_shadow
          npx vitest run --project integration
