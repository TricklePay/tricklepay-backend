
name: Gitleaks Secret Scan

on:
  pull_request:
    paths:
      - "**"
      - ".gitleaks.toml"
      - ".github/workflows/gitleaks.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
