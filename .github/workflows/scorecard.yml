name: Scorecard

# OpenSSF Scorecard supply-chain posture (pinned deps, token permissions, and
# related checks). See docs/code-scanning.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 6' # weekly, Saturday 01:30 UTC

# https://github.com/ossf/scorecard-action#workflow-example
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif