services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tricklepay
      POSTGRES_PASSWORD: tricklepay
      POSTGRES_DB: tricklepay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tricklepay"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in database for the integration suite (npx vitest run --project
  # integration). Separate container name, port and volume from `postgres`
  # above, so starting it can never point tests at development data or
  # collide with a `postgres` already running: `docker compose --profile
  # test up -d postgres-test` runs it alongside, or standalone, the dev
  # database without either affecting the other.
  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    container_name: tricklepay-postgres-test
    environment:
      POSTGRES_USER: tricklepay_test
      POSTGRES_PASSWORD: tricklepay_test
      POSTGRES_DB: tricklepay_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tricklepay_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration service that runs prisma migrate deploy using the
  # dedicated migration image target so the API runtime image does not need
  # to ship dev dependencies (like the Prisma CLI).
  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tricklepay:tricklepay@postgres:5432/tricklepay}
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tricklepay:tricklepay@postgres:5432/tricklepay}
      NETWORK: ${NETWORK:-testnet}
      STREAM_CONTRACT_ID: ${STREAM_CONTRACT_ID:?STREAM_CONTRACT_ID must be set to the deployed Soroban stream contract address}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
    ports:
      - "3000:3000"
    command: ["node", "dist/index.js"]

volumes:
  pgdata:
  pgdata-test:
