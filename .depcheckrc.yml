# Configuration for `npm run depcheck`, which CI runs once per push and pull
# request (the `depcheck` job in .github/workflows/ci.yml). The run fails on an
# unused dependency or on an import of a package that package.json does not
# declare.
#
# Packages used only as command-line tools (typescript via `tsc`, tsx, prisma,
# depcheck itself) are found through the `bin` entries in node_modules, so run
# depcheck after `npm ci`; on a checkout with nothing installed they are
# reported as unused.

# Packages depcheck misreports. Every entry needs a comment saying why it is a
# false positive. None are needed today: pino-pretty, the one package loaded
# only by name (as a pino transport target), is found through its
# require.resolve call in src/logger.ts.
ignores: []

# Generated or build output, which is not source and would otherwise be read
# as if it were.
ignore-patterns:
  # Compiled output of `npm run build`.
  - dist
  # Prisma client generated by `prisma generate`; it imports Prisma's runtime
  # internals, which are not dependencies of this project.
  - src/generated
  # Coverage reports from `vitest --coverage`.
  - coverage
